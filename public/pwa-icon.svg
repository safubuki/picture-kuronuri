<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Shield Shape -->
  <g filter="url(#shadow)">
    <path d="M256 72 C340 72 408 116 408 160 C408 304 256 424 256 424 C256 424 104 304 104 160 C104 116 172 72 256 72 Z"
          fill="url(#shieldGrad)" />
  </g>

  <!-- Inner Dark Mask Pattern (representing KuroNuri / redaction) -->
  <path d="M256 96 C324 96 380 132 380 170 C380 290 256 394 256 394 C256 394 132 290 132 170 C132 132 188 96 256 96 Z"
        fill="#0f172a" fill-opacity="0.9" />

  <!-- KuroNuri Redaction Bar (black with neon glow) -->
  <rect x="176" y="210" width="160" height="34" rx="8" fill="#000000" stroke="#38bdf8" stroke-width="3" />
  <rect x="200" y="260" width="112" height="26" rx="6" fill="#000000" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Security Check Icon -->
  <path d="M220 326 L246 352 L298 296" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
</svg>
